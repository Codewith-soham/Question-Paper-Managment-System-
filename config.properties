# Question Paper Management System Configuration
# This file contains all configurable settings for the application

# ============================================
# DATABASE CONFIGURATION
# ============================================
# MySQL Database Connection Settings
db.url=jdbc:mysql://localhost:3306/questionpaper?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=soham1234

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# ============================================
# EMAIL CONFIGURATION
# ============================================
# SMTP Settings for sending emails
# For Gmail: smtp.gmail.com, Port: 587
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=your-email@gmail.com
smtp.password=your-app-password
smtp.auth=true
smtp.starttls.enable=true

# Email Display Settings
email.from.name=Question Paper System
email.subject.prefix=[QPMS]

# ============================================
# WEB SERVER CONFIGURATION
# ============================================
# Server Port (8080 for development, 80 for production)
server.port=8080
server.host=0.0.0.0

# CORS Settings (for online deployment)
server.cors.enabled=true
server.cors.allowedOrigins=*

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
# PDF Storage Settings
upload.directory=PDF
upload.maxFileSize=10485760
upload.allowedExtensions=pdf

# File Organization (true = organize in year/subject folders)
upload.organizeByYear=false
upload.organizeBySubject=false

# File Naming Convention
# Options: original, timestamp, uuid, custom
upload.namingStrategy=original

# ============================================
# SECURITY CONFIGURATION
# ============================================
# Authentication (for future implementation)
security.enabled=false
security.jwt.secret=your-secret-key-change-this-in-production
security.jwt.expiration=86400000

# Rate Limiting
security.ratelimit.enabled=false
security.ratelimit.requestsPerMinute=60

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Log Levels: DEBUG, INFO, WARN, ERROR
logging.level=INFO
logging.file=logs/qpms.log
logging.maxFileSize=10MB
logging.maxHistory=30

# ============================================
# APPLICATION SETTINGS
# ============================================
# Application Info
app.name=Question Paper Management System
app.version=2.0
app.environment=development

# Backup Settings
backup.enabled=false
backup.directory=backups
backup.schedule.cron=0 0 2 * * ?

# ============================================
# NOTES FOR DEPLOYMENT
# ============================================
# DEVELOPMENT: Keep default settings
# PRODUCTION:
#   1. Change db.password to secure password
#   2. Set smtp.username and smtp.password
#   3. Change server.port to 80 or use reverse proxy
#   4. Set security.enabled=true
#   5. Change app.environment=production
#   6. Enable backup.enabled=true
