<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Question Paper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
    <div class="app-header__inner container">
        <h1 class="app-title">Add Question Paper</h1>
        <nav class="app-nav">
            <a class="nav-link" href="index.html">Dashboard</a>
            <a class="nav-link" href="search.html">Search</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="section">
        <h2>New Paper Details</h2>
        <p class="section-description">📤 Upload a question paper PDF directly - no manual file copying needed!</p>
        <form id="addPaperForm" class="form-grid" autocomplete="off" enctype="multipart/form-data">
            <div class="form-field">
                <label>Subject</label>
                <input type="text" name="subject" placeholder="e.g., DBMS" required>
            </div>
            <div class="form-field">
                <label>Academic Year</label>
                <select name="academicYear" required>
                    <option value="">Select Academic Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>
            <div class="form-field">
                <label>Exam Month</label>
                <select name="examMonth" required>
                    <option value="">Select Exam Month</option>
                    <option value="May">May</option>
                    <option value="December">December</option>
                </select>
            </div>
            <div class="form-field">
                <label>Year</label>
                <input type="number" name="year" placeholder="e.g., 2025" required min="1900" max="2100">
            </div>
            <div class="form-field">
                <label>Semester</label>
                <input type="number" name="semester" placeholder="e.g., 3" required min="1" max="10">
            </div>
            <div class="form-field form-field-file">
                <label>📄 Upload PDF File *</label>
                <input type="file" name="pdfFile" id="pdfFile" accept=".pdf,application/pdf" required>
                <small class="field-hint">Maximum file size: 10MB | Only PDF files allowed</small>
                <div id="fileInfo" class="file-info" style="display:none;"></div>
            </div>
            <div class="form-field">
                <label>Status</label>
                <select name="status" required>
                    <option value="">Select Status</option>
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="NOT AVAILABLE">NOT AVAILABLE</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Reset</button>
                <button type="submit" class="btn" id="submitBtn">
                    <span class="btn-text">📤 Upload & Add Paper</span>
                    <span class="btn-loading" style="display:none;">⏳ Uploading...</span>
                </button>
            </div>
        </form>
        <div id="addInfo" class="info"></div>
    </section>
</main>

<footer class="app-footer">
    <div class="container">
        <p>Need to find a paper? <a href="search.html">Search here</a>.</p>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
